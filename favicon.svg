<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#bgGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Central Calendar/Planner Glyph -->
  <rect x="14" y="18" width="36" height="32" rx="8" fill="url(#bgGrad)" filter="url(#glow)"/>
  <line x1="20" y1="14" x2="20" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="14" x2="44" y2="20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="50" y2="28" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- AI Sparkle star -->
  <path d="M44 32 C44 36, 48 36, 48 40 C48 36, 52 36, 52 32 C48 32, 48 28, 48 28 C48 28, 48 32, 44 32 Z" fill="url(#sparkleGrad)"/>
  <!-- Calendar grid dots -->
  <circle cx="23" cy="36" r="2.5" fill="#FFFFFF"/>
  <circle cx="32" cy="36" r="2.5" fill="#FFFFFF"/>
  <circle cx="23" cy="43" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="32" cy="43" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
