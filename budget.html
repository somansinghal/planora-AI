<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Management – Planora AI</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout" id="app-root"></div>
  <div id="toast-container" role="alert" aria-live="polite"></div>

  <!-- Add Expense Modal -->
  <div class="modal-backdrop hidden" id="expense-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" style="max-width: 540px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Expense Item</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close dialog">&times;</button>
      </div>
      <form id="expense-form">
        <input type="hidden" id="exp-id" value="">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="exp-name">Expense Name <span class="required">*</span></label>
            <input type="text" id="exp-name" class="form-input" placeholder="e.g. Stage Decor & Flower Arches" required maxlength="200">
          </div>
          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="exp-category">Category <span class="required">*</span></label>
              <select id="exp-category" class="form-input form-select" required>
                <option value="venue">Venue & Hall</option>
                <option value="catering">Catering & Food</option>
                <option value="decoration">Decor & Floral</option>
                <option value="photography">Photography & Film</option>
                <option value="entertainment">Entertainment & DJ</option>
                <option value="clothing">Clothing & Styling</option>
                <option value="invitations">Invitations & Stationery</option>
                <option value="sound_lighting">Sound & Lighting</option>
                <option value="transportation">Transport & Logistics</option>
                <option value="other">Other Expenses</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="exp-estimated">Estimated Cost <span class="required">*</span></label>
              <input type="number" id="exp-estimated" class="form-input" placeholder="0" min="0" step="100" required>
            </div>
          </div>
          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="exp-actual">Actual / Paid Amount</label>
              <input type="number" id="exp-actual" class="form-input" placeholder="Leave blank if not paid" min="0" step="100">
            </div>
            <div class="form-group">
              <label class="form-label" for="exp-vendor">Vendor Name</label>
              <input type="text" id="exp-vendor" class="form-input" placeholder="e.g. Royal Decorators" maxlength="200">
            </div>
          </div>
          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-text-primary);">
              <input type="checkbox" id="exp-paid"> Mark as Paid / Settled
            </label>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="exp-notes">Notes / Invoice Reference</label>
            <input type="text" id="exp-notes" class="form-input" placeholder="e.g. Advance paid, balance due on event morning" maxlength="500">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-expense">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, showAuthLoading, hideAuthLoading } from './js/auth-guard.js';
    import { getAppShellHTML, getTopbarHTML } from './js/app-shell.js';
    import { getEvents, getEvent, getExpenses, createExpense, updateExpense, deleteExpense, getBudgetSummary, getExportUrl } from './js/api.js';
    import { showToast, formatCurrency, formatDate, escapeHtml, showConfirm } from './js/utils.js';
    import { initSidebar } from './js/navigation.js';

    showAuthLoading();
    const user = await requireAuth();
    hideAuthLoading();

    const urlParams = new URLSearchParams(window.location.search);
    let selectedEventId = urlParams.get('event_id') || localStorage.getItem('planora_active_event_id');
    let currentEvent = null;
    let expensesList = [];
    let chartInstance = null;

    const root = document.getElementById('app-root');
    root.innerHTML = `
      ${getAppShellHTML('budget')}
      <div class="app-main" id="app-main">
        ${getTopbarHTML('Budget Management')}
        <main class="app-content page-enter">
          <div class="workspace-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4);">
              <div>
                <div class="workspace-event-type">💰 Financial Hub</div>
                <h1 class="workspace-event-name" style="font-size: var(--text-2xl);" id="page-event-name">Event Budget</h1>
                <p style="color: var(--color-text-secondary); margin-top: var(--space-1); font-size: var(--text-sm);">
                  Track estimated allocations vs actual expenses, monitor cashflow, and avoid overspending.
                </p>
              </div>
              <div style="display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;">
                <select id="event-selector" class="form-input form-select" style="padding: var(--space-2) var(--space-3); font-size: var(--text-sm); min-width: 220px;">
                  <option value="">Loading events...</option>
                </select>
                <button class="btn btn-primary btn-sm" id="btn-open-add-expense">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  <span>Add Expense</span>
                </button>
                <a id="btn-export-csv" class="btn btn-secondary btn-sm" target="_blank" download>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  <span>Export CSV</span>
                </a>
              </div>
            </div>

            <!-- Workspace Navigation Tabs -->
            <nav class="workspace-tabs" style="margin-top: var(--space-6); margin-bottom: 0;">
              <a href="planner.html" class="workspace-tab" id="tab-studio">✨ AI Studio</a>
              <a href="budget.html" class="workspace-tab active" id="tab-budget">💰 Budget</a>
              <a href="timeline.html" class="workspace-tab" id="tab-timeline">📅 Timeline</a>
              <a href="tasks.html" class="workspace-tab" id="tab-tasks">✅ Tasks</a>
              <a href="vendors.html" class="workspace-tab" id="tab-vendors">🤝 Vendors</a>
              <a href="guests.html" class="workspace-tab" id="tab-guests">👥 Guests</a>
              <a href="copilot.html" class="workspace-tab" id="tab-copilot">🤖 Copilot</a>
              <a href="reports.html" class="workspace-tab" id="tab-reports">📊 Reports</a>
            </nav>
          </div>

          <!-- Empty state if no event exists -->
          <div id="no-event-view" class="card empty-state hidden" style="padding: var(--space-12); text-align: center;">
            <div class="empty-icon" style="font-size: 3rem; margin-bottom: var(--space-4);">📊</div>
            <h3 style="font-size: var(--text-xl); font-weight: var(--font-semibold); margin-bottom: var(--space-2);">No Event Selected</h3>
            <p style="color: var(--color-text-secondary); max-width: 440px; margin: 0 auto var(--space-6);">Create an event first to manage budgets and expenses.</p>
            <a href="create-event.html" class="btn btn-primary">Create Event</a>
          </div>

          <!-- Budget Content View -->
          <div id="budget-view" class="hidden">
            <!-- 4 Top Stat Cards -->
            <div class="dashboard-stats" style="margin-bottom: var(--space-6);">
              <div class="stat-card">
                <div class="stat-card-header">
                  <span class="stat-card-title">Total Budget</span>
                  <div class="stat-card-icon" style="background: rgba(124,58,237,0.15); color: #A78BFA;">💰</div>
                </div>
                <div class="stat-card-value" id="stat-total-budget">-</div>
                <div class="stat-card-subtext">Planned ceiling</div>
              </div>

              <div class="stat-card">
                <div class="stat-card-header">
                  <span class="stat-card-title">Estimated Spend</span>
                  <div class="stat-card-icon" style="background: rgba(79,70,229,0.15); color: #818CF8;">📋</div>
                </div>
                <div class="stat-card-value" id="stat-estimated-spend">-</div>
                <div class="stat-card-subtext">Total allocated</div>
              </div>

              <div class="stat-card">
                <div class="stat-card-header">
                  <span class="stat-card-title">Actual Spent</span>
                  <div class="stat-card-icon" style="background: rgba(16,185,129,0.15); color: #34D399;">💸</div>
                </div>
                <div class="stat-card-value" id="stat-actual-spent">-</div>
                <div class="stat-card-subtext">Paid or invoiced</div>
              </div>

              <div class="stat-card">
                <div class="stat-card-header">
                  <span class="stat-card-title">Remaining Balance</span>
                  <div class="stat-card-icon" style="background: rgba(6,182,212,0.15); color: #22D3EE;">🏦</div>
                </div>
                <div class="stat-card-value" id="stat-remaining-budget">-</div>
                <div class="stat-card-subtext" id="stat-utilization-text">0% utilized</div>
              </div>
            </div>

            <!-- Budget Progress Bar Card -->
            <div class="card" style="padding: var(--space-5); margin-bottom: var(--space-6);">
              <div style="display: flex; justify-content: space-between; font-size: var(--text-sm); margin-bottom: var(--space-2);">
                <span style="font-weight: var(--font-medium); color: var(--color-text-secondary);">Budget Utilization</span>
                <span style="font-weight: var(--font-bold); color: var(--color-text-primary);" id="bar-percentage-label">0%</span>
              </div>
              <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.06); border-radius: 5px; overflow: hidden;">
                <div id="budget-progress-bar" style="width: 0%; height: 100%; background: var(--gradient-brand); transition: width 0.5s ease;"></div>
              </div>
            </div>

            <!-- Grid: Category Distribution Chart & Summary -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); margin-bottom: var(--space-6);" id="budget-chart-grid">
              <div class="card" style="padding: var(--space-6); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); margin-bottom: var(--space-4); width: 100%;">Category Allocation</h3>
                <div style="max-width: 280px; max-height: 280px; width: 100%;">
                  <canvas id="categoryChart"></canvas>
                </div>
              </div>

              <div class="card" style="padding: var(--space-6);">
                <h3 style="font-size: var(--text-base); font-weight: var(--font-semibold); margin-bottom: var(--space-4);">Category Breakdown</h3>
                <div id="category-summary-list" style="display: flex; flex-direction: column; gap: var(--space-3); max-height: 280px; overflow-y: auto;">
                  <!-- Dynamic categories -->
                </div>
              </div>
            </div>

            <!-- Itemized Expenses Table -->
            <div class="card" style="padding: var(--space-6);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-3);">
                <h3 style="font-size: var(--text-lg); font-weight: var(--font-semibold);">Itemized Expenses</h3>
                <div style="display: flex; gap: var(--space-2);">
                  <input type="text" id="expense-search" class="form-input" placeholder="Search expenses..." style="width: 220px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm);">
                </div>
              </div>

              <div style="overflow-x: auto;">
                <table class="table" style="width: 100%; border-collapse: collapse;">
                  <thead>
                    <tr style="border-bottom: 1px solid var(--color-border-subtle); text-align: left; font-size: var(--text-xs); color: var(--color-text-tertiary); text-transform: uppercase;">
                      <th style="padding: var(--space-3);">Expense</th>
                      <th style="padding: var(--space-3);">Category</th>
                      <th style="padding: var(--space-3);">Estimated</th>
                      <th style="padding: var(--space-3);">Actual</th>
                      <th style="padding: var(--space-3);">Vendor</th>
                      <th style="padding: var(--space-3);">Status</th>
                      <th style="padding: var(--space-3); text-align: right;">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="expenses-tbody">
                    <!-- Dynamic rows -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    `;

    initSidebar();

    // ── Load Events ──────────────────────────────────────────
    async function loadEvents() {
      const res = await getEvents();
      const selector = document.getElementById('event-selector');
      if (!res.ok || !res.data || !res.data.events || res.data.events.length === 0) {
        document.getElementById('no-event-view').classList.remove('hidden');
        document.getElementById('budget-view').classList.add('hidden');
        selector.innerHTML = '<option value="">No events found</option>';
        return;
      }

      const events = res.data.events;
      selector.innerHTML = events.map(ev => `
        <option value="${ev.id}" ${ev.id === selectedEventId ? 'selected' : ''}>
          ${escapeHtml(ev.name)}
        </option>
      `).join('');

      if (!selectedEventId || !events.some(e => e.id === selectedEventId)) {
        selectedEventId = events[0].id;
      }
      localStorage.setItem('planora_active_event_id', selectedEventId);

      // Update workspace tabs URLs
      document.getElementById('tab-studio').href = `planner.html?event_id=${selectedEventId}`;
      document.getElementById('tab-budget').href = `budget.html?event_id=${selectedEventId}`;
      document.getElementById('tab-timeline').href = `timeline.html?event_id=${selectedEventId}`;
      document.getElementById('tab-tasks').href = `tasks.html?event_id=${selectedEventId}`;
      document.getElementById('tab-vendors').href = `vendors.html?event_id=${selectedEventId}`;
      document.getElementById('tab-guests').href = `guests.html?event_id=${selectedEventId}`;
      document.getElementById('tab-copilot').href = `copilot.html?event_id=${selectedEventId}`;
      document.getElementById('tab-reports').href = `reports.html?event_id=${selectedEventId}`;

      await refreshBudgetData();
    }

    async function refreshBudgetData() {
      const evRes = await getEvent(selectedEventId);
      if (!evRes.ok) return;
      currentEvent = evRes.data;

      document.getElementById('no-event-view').classList.add('hidden');
      document.getElementById('budget-view').classList.remove('hidden');
      document.getElementById('page-event-name').textContent = `${currentEvent.name} – Budget`;
      document.getElementById('btn-export-csv').href = getExportUrl(selectedEventId, 'expenses');

      // Fetch summary and expenses
      const [sumRes, expRes] = await Promise.all([
        getBudgetSummary(selectedEventId),
        getExpenses(selectedEventId),
      ]);

      if (sumRes.ok && sumRes.data) {
        renderSummary(sumRes.data);
      }
      if (expRes.ok && expRes.data) {
        expensesList = expRes.data;
        renderExpensesTable(expensesList);
      }
    }

    function renderSummary(summary) {
      const curr = summary.currency || currentEvent.currency || 'INR';
      document.getElementById('stat-total-budget').textContent = formatCurrency(summary.total_budget, curr);
      document.getElementById('stat-estimated-spend').textContent = formatCurrency(summary.total_estimated, curr);
      document.getElementById('stat-actual-spent').textContent = formatCurrency(summary.total_actual, curr);
      document.getElementById('stat-remaining-budget').textContent = formatCurrency(summary.remaining_budget, curr);

      const util = Math.min(summary.utilization_percentage, 100);
      document.getElementById('stat-utilization-text').textContent = `${summary.utilization_percentage}% utilized`;
      document.getElementById('bar-percentage-label').textContent = `${summary.utilization_percentage}%`;
      const bar = document.getElementById('budget-progress-bar');
      bar.style.width = `${util}%`;
      if (summary.over_budget) {
        bar.style.background = 'var(--color-status-danger)';
        document.getElementById('stat-remaining-budget').style.color = 'var(--color-status-danger)';
      } else {
        bar.style.background = 'var(--gradient-brand)';
        document.getElementById('stat-remaining-budget').style.color = 'var(--color-text-accent)';
      }

      // Render category breakdown list
      const list = document.getElementById('category-summary-list');
      if (!summary.category_breakdown || summary.category_breakdown.length === 0) {
        list.innerHTML = `<div style="color: var(--color-text-tertiary); font-size: var(--text-sm); text-align: center; padding: var(--space-4);">No category expenses added yet.</div>`;
      } else {
        list.innerHTML = summary.category_breakdown.map(cat => `
          <div style="background: var(--color-bg-surface); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); display: flex; justify-content: space-between; align-items: center; font-size: var(--text-sm);">
            <div>
              <strong style="text-transform: capitalize; color: var(--color-text-primary);">${escapeHtml(cat.category)}</strong>
              <div style="font-size: var(--text-xs); color: var(--color-text-tertiary);">${cat.item_count} items</div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: var(--font-semibold); color: var(--color-text-accent);">${formatCurrency(cat.actual_total || cat.estimated_total, curr)}</div>
              <div style="font-size: var(--text-xs); color: var(--color-text-secondary);">${cat.actual_total > 0 ? 'Actual' : 'Est.'}</div>
            </div>
          </div>
        `).join('');
      }

      // Render Chart.js
      renderChart(summary.category_breakdown, curr);
    }

    function renderChart(categories, curr) {
      const ctx = document.getElementById('categoryChart');
      if (!ctx) return;

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (!categories || categories.length === 0) {
        ctx.style.display = 'none';
        return;
      }
      ctx.style.display = 'block';

      const labels = categories.map(c => c.category.charAt(0).toUpperCase() + c.category.slice(1));
      const data = categories.map(c => c.actual_total || c.estimated_total);

      const colors = [
        '#7C3AED', '#4F46E5', '#2563EB', '#06B6D4',
        '#10B981', '#F59E0B', '#F97316', '#EC4899', '#8B5CF6'
      ];

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: colors.slice(0, data.length),
            borderWidth: 0,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          cutout: '70%',
        }
      });
    }

    function renderExpensesTable(expenses) {
      const tbody = document.getElementById('expenses-tbody');
      const curr = currentEvent?.currency || 'INR';

      if (!expenses || expenses.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: var(--space-8); color: var(--color-text-tertiary);">
              No expenses recorded yet. Click "Add Expense" or generate an AI plan to populate your budget.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = expenses.map(exp => `
        <tr style="border-bottom: 1px solid var(--color-border-subtle); font-size: var(--text-sm);">
          <td style="padding: var(--space-3);">
            <strong>${escapeHtml(exp.name)}</strong>
            ${exp.notes ? `<div style="font-size: var(--text-xs); color: var(--color-text-tertiary);">${escapeHtml(exp.notes)}</div>` : ''}
          </td>
          <td style="padding: var(--space-3); text-transform: capitalize;">${escapeHtml(exp.category)}</td>
          <td style="padding: var(--space-3); color: var(--color-text-secondary);">${formatCurrency(exp.estimated_amount, curr)}</td>
          <td style="padding: var(--space-3); font-weight: var(--font-semibold);">${exp.actual_amount ? formatCurrency(exp.actual_amount, curr) : '—'}</td>
          <td style="padding: var(--space-3); color: var(--color-text-secondary);">${escapeHtml(exp.vendor_name || '—')}</td>
          <td style="padding: var(--space-3);">
            <span class="badge ${exp.is_paid ? 'badge-success' : 'badge-warning'}">
              ${exp.is_paid ? 'Paid' : 'Pending'}
            </span>
          </td>
          <td style="padding: var(--space-3); text-align: right;">
            <button class="btn btn-ghost btn-xs btn-edit-exp" data-id="${exp.id}" title="Edit expense">✏️</button>
            <button class="btn btn-ghost btn-xs btn-del-exp" data-id="${exp.id}" title="Delete expense" style="color: var(--color-status-danger);">🗑️</button>
          </td>
        </tr>
      `).join('');

      // Wire row action listeners
      document.querySelectorAll('.btn-edit-exp').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const item = expensesList.find(e => e.id === id);
          if (item) openModal(item);
        });
      });

      document.querySelectorAll('.btn-del-exp').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const confirmed = await showConfirm({
            title: 'Delete Expense',
            message: 'Are you sure you want to delete this expense? This action cannot be undone.',
            confirmText: 'Delete',
            danger: true,
          });
          if (!confirmed) return;

          const res = await deleteExpense(id);
          if (res.ok) {
            showToast('Expense deleted', 'success');
            refreshBudgetData();
          } else {
            showToast(res.error || 'Failed to delete expense', 'error');
          }
        });
      });
    }

    // Search filter
    document.getElementById('expense-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = expensesList.filter(exp => 
        exp.name.toLowerCase().includes(term) ||
        exp.category.toLowerCase().includes(term) ||
        (exp.vendor_name && exp.vendor_name.toLowerCase().includes(term))
      );
      renderExpensesTable(filtered);
    });

    // ── Modal Handling ───────────────────────────────────────
    function openModal(item = null) {
      document.getElementById('expense-form').reset();
      if (item) {
        document.getElementById('modal-title').textContent = 'Edit Expense Item';
        document.getElementById('exp-id').value = item.id;
        document.getElementById('exp-name').value = item.name;
        document.getElementById('exp-category').value = item.category;
        document.getElementById('exp-estimated').value = item.estimated_amount;
        document.getElementById('exp-actual').value = item.actual_amount || '';
        document.getElementById('exp-vendor').value = item.vendor_name || '';
        document.getElementById('exp-paid').checked = !!item.is_paid;
        document.getElementById('exp-notes').value = item.notes || '';
      } else {
        document.getElementById('modal-title').textContent = 'Add Expense Item';
        document.getElementById('exp-id').value = '';
      }
      document.getElementById('expense-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('expense-modal').classList.add('hidden');
    }

    document.getElementById('btn-open-add-expense').addEventListener('click', () => openModal());
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

    document.getElementById('expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('exp-id').value;
      const name = document.getElementById('exp-name').value.trim();
      const category = document.getElementById('exp-category').value;
      const estimated = parseFloat(document.getElementById('exp-estimated').value);
      const actualVal = document.getElementById('exp-actual').value;
      const actual = actualVal ? parseFloat(actualVal) : null;
      const vendor_name = document.getElementById('exp-vendor').value.trim() || null;
      const is_paid = document.getElementById('exp-paid').checked;
      const notes = document.getElementById('exp-notes').value.trim() || null;

      if (!name) {
        showToast('Please enter an expense name', 'error');
        return;
      }
      if (isNaN(estimated) || estimated < 0) {
        showToast('Please enter a valid estimated amount', 'error');
        return;
      }

      const payload = {
        name,
        category,
        estimated_amount: estimated,
        actual_amount: actual,
        vendor_name,
        is_paid,
        notes,
      };

      let res;
      if (id) {
        res = await updateExpense(id, payload);
      } else {
        res = await createExpense(selectedEventId, payload);
      }

      if (res.ok) {
        showToast(id ? 'Expense updated' : 'Expense added', 'success');
        closeModal();
        refreshBudgetData();
      } else {
        showToast(res.error || 'Failed to save expense', 'error');
      }
    });

    // Reactive refresh when data changes in other tabs or workspace views
    window.addEventListener('planora:data-updated', () => refreshBudgetData());
    window.addEventListener('storage', (e) => {
      if (!e.key || e.key.startsWith('planora_')) {
        refreshBudgetData();
      }
    });
    window.addEventListener('pageshow', () => refreshBudgetData());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        refreshBudgetData();
      }
    });

    loadEvents();
  </script>
</body>
</html>
