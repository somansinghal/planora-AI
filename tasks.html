<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management – Planora AI</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout" id="app-root"></div>
  <div id="toast-container" role="alert" aria-live="polite"></div>

  <!-- Add Task Modal -->
  <div class="modal-backdrop hidden" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add New Task</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close dialog">&times;</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" value="">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="task-title">Task Title <span class="required">*</span></label>
            <input type="text" id="task-title" class="form-input" placeholder="e.g. Confirm guest count with caterer" required maxlength="300">
          </div>
          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="task-priority">Priority</label>
              <select id="task-priority" class="form-input form-select">
                <option value="high">🔴 High Priority</option>
                <option value="medium" selected>🟡 Medium Priority</option>
                <option value="low">🟢 Low Priority</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="task-status">Status</label>
              <select id="task-status" class="form-input form-select">
                <option value="todo" selected>To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Completed</option>
              </select>
            </div>
          </div>
          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="task-due-date">Due Date</label>
              <input type="date" id="task-due-date" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label" for="task-assigned">Assigned To</label>
              <input type="text" id="task-assigned" class="form-input" placeholder="e.g. Suman, Decor Coordinator" maxlength="200">
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="task-desc">Description / Instructions</label>
            <textarea id="task-desc" class="form-input" rows="3" placeholder="Additional details..." maxlength="1000"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, showAuthLoading, hideAuthLoading } from './js/auth-guard.js';
    import { getAppShellHTML, getTopbarHTML } from './js/app-shell.js';
    import { getEvents, getEvent, getTasks, createTask, updateTask, deleteTask, getExportUrl } from './js/api.js';
    import { showToast, formatDate, escapeHtml, showConfirm } from './js/utils.js';
    import { initSidebar } from './js/navigation.js';

    showAuthLoading();
    const user = await requireAuth();
    hideAuthLoading();

    const urlParams = new URLSearchParams(window.location.search);
    let selectedEventId = urlParams.get('event_id') || localStorage.getItem('planora_active_event_id');
    let currentEvent = null;
    let allTasks = [];
    let currentFilter = 'all';

    const root = document.getElementById('app-root');
    root.innerHTML = `
      ${getAppShellHTML('tasks')}
      <div class="app-main" id="app-main">
        ${getTopbarHTML('Task Management')}
        <main class="app-content page-enter">
          <div class="workspace-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4);">
              <div>
                <div class="workspace-event-type">✅ Execution Operations</div>
                <h1 class="workspace-event-name" style="font-size: var(--text-2xl);" id="page-event-name">Event Tasks</h1>
                <p style="color: var(--color-text-secondary); margin-top: var(--space-1); font-size: var(--text-sm);">
                  Organize checklists, assign priorities, and ensure zero details slip through the cracks.
                </p>
              </div>
              <div style="display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;">
                <select id="event-selector" class="form-input form-select" style="padding: var(--space-2) var(--space-3); font-size: var(--text-sm); min-width: 220px;">
                  <option value="">Loading events...</option>
                </select>
                <button class="btn btn-primary btn-sm" id="btn-open-add-task">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  <span>New Task</span>
                </button>
                <a id="btn-export-tasks-csv" class="btn btn-secondary btn-sm" target="_blank" download>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  <span>Export CSV</span>
                </a>
              </div>
            </div>

            <nav class="workspace-tabs" style="margin-top: var(--space-6); margin-bottom: 0;">
              <a href="planner.html" class="workspace-tab" id="tab-studio">✨ AI Studio</a>
              <a href="budget.html" class="workspace-tab" id="tab-budget">💰 Budget</a>
              <a href="timeline.html" class="workspace-tab" id="tab-timeline">📅 Timeline</a>
              <a href="tasks.html" class="workspace-tab active" id="tab-tasks">✅ Tasks</a>
              <a href="vendors.html" class="workspace-tab" id="tab-vendors">🤝 Vendors</a>
              <a href="guests.html" class="workspace-tab" id="tab-guests">👥 Guests</a>
              <a href="copilot.html" class="workspace-tab" id="tab-copilot">🤖 Copilot</a>
              <a href="reports.html" class="workspace-tab" id="tab-reports">📊 Reports</a>
            </nav>
          </div>

          <div id="no-event-view" class="card empty-state hidden" style="padding: var(--space-12); text-align: center;">
            <div class="empty-icon" style="font-size: 3rem; margin-bottom: var(--space-4);">📋</div>
            <h3 style="font-size: var(--text-xl); font-weight: var(--font-semibold); margin-bottom: var(--space-2);">No Event Selected</h3>
            <p style="color: var(--color-text-secondary); max-width: 440px; margin: 0 auto var(--space-6);">Create an event first to track tasks and milestones.</p>
            <a href="create-event.html" class="btn btn-primary">Create Event</a>
          </div>

          <div id="tasks-view" class="hidden">
            <!-- Filter Pills & Search -->
            <div class="card" style="padding: var(--space-4) var(--space-6); margin-bottom: var(--space-6); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4);">
              <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;" id="filter-pills">
                <button class="btn btn-sm btn-primary filter-btn active" data-filter="all">All (<span id="count-all">0</span>)</button>
                <button class="btn btn-sm btn-secondary filter-btn" data-filter="todo">To Do (<span id="count-todo">0</span>)</button>
                <button class="btn btn-sm btn-secondary filter-btn" data-filter="in_progress">In Progress (<span id="count-prog">0</span>)</button>
                <button class="btn btn-sm btn-secondary filter-btn" data-filter="done">Completed (<span id="count-done">0</span>)</button>
              </div>

              <input type="text" id="task-search" class="form-input" placeholder="Search tasks..." style="width: 240px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm);">
            </div>

            <!-- Task List Card -->
            <div class="card" style="padding: var(--space-6);">
              <div id="tasks-list-container" style="display: flex; flex-direction: column; gap: var(--space-3);">
                <!-- Dynamic tasks -->
              </div>
            </div>
          </div>
        </main>
      </div>
    `;

    initSidebar();

    async function loadEvents() {
      const res = await getEvents();
      const selector = document.getElementById('event-selector');
      if (!res.ok || !res.data || !res.data.events || res.data.events.length === 0) {
        document.getElementById('no-event-view').classList.remove('hidden');
        document.getElementById('tasks-view').classList.add('hidden');
        selector.innerHTML = '<option value="">No events found</option>';
        return;
      }

      const events = res.data.events;
      selector.innerHTML = events.map(ev => `
        <option value="${ev.id}" ${ev.id === selectedEventId ? 'selected' : ''}>
          ${escapeHtml(ev.name)}
        </option>
      `).join('');

      if (!selectedEventId || !events.some(e => e.id === selectedEventId)) {
        selectedEventId = events[0].id;
      }
      localStorage.setItem('planora_active_event_id', selectedEventId);

      document.getElementById('tab-studio').href = `planner.html?event_id=${selectedEventId}`;
      document.getElementById('tab-budget').href = `budget.html?event_id=${selectedEventId}`;
      document.getElementById('tab-timeline').href = `timeline.html?event_id=${selectedEventId}`;
      document.getElementById('tab-tasks').href = `tasks.html?event_id=${selectedEventId}`;
      document.getElementById('tab-vendors').href = `vendors.html?event_id=${selectedEventId}`;
      document.getElementById('tab-guests').href = `guests.html?event_id=${selectedEventId}`;
      document.getElementById('tab-copilot').href = `copilot.html?event_id=${selectedEventId}`;
      document.getElementById('tab-reports').href = `reports.html?event_id=${selectedEventId}`;

      await refreshTasks();
    }

    async function refreshTasks() {
      const evRes = await getEvent(selectedEventId);
      if (!evRes.ok) return;
      currentEvent = evRes.data;

      document.getElementById('no-event-view').classList.add('hidden');
      document.getElementById('tasks-view').classList.remove('hidden');
      document.getElementById('page-event-name').textContent = `${currentEvent.name} – Tasks`;
      document.getElementById('btn-export-tasks-csv').href = getExportUrl(selectedEventId, 'tasks');

      const tasksRes = await getTasks(selectedEventId);
      allTasks = tasksRes.ok ? (tasksRes.data || []) : [];

      updateCounts();
      renderFilteredTasks();
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allTasks.length;
      document.getElementById('count-todo').textContent = allTasks.filter(t => t.status === 'todo').length;
      document.getElementById('count-prog').textContent = allTasks.filter(t => t.status === 'in_progress').length;
      document.getElementById('count-done').textContent = allTasks.filter(t => t.status === 'done').length;
    }

    function renderFilteredTasks() {
      const container = document.getElementById('tasks-list-container');
      const search = (document.getElementById('task-search')?.value || '').toLowerCase();

      let list = allTasks;
      if (currentFilter !== 'all') {
        list = list.filter(t => t.status === currentFilter);
      }
      if (search) {
        list = list.filter(t => 
          t.title.toLowerCase().includes(search) || 
          (t.description && t.description.toLowerCase().includes(search))
        );
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: var(--space-8); color: var(--color-text-tertiary); font-size: var(--text-sm);">
            No tasks found. Click "New Task" or generate an AI plan to populate tasks automatically.
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(t => {
        const isDone = t.status === 'done';
        const priorityColors = {
          high: 'badge-danger',
          medium: 'badge-warning',
          low: 'badge-neutral',
        };
        return `
          <div style="background: var(--color-bg-surface); border: 1px solid var(--color-border-subtle); padding: var(--space-3) var(--space-4); border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); transition: all var(--transition-fast);">
            <div style="display: flex; align-items: center; gap: var(--space-3); flex: 1;">
              <input type="checkbox" class="task-checkbox" data-id="${t.id}" ${isDone ? 'checked' : ''} style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--color-brand-primary);">
              <div style="flex: 1;">
                <div style="font-size: var(--text-sm); font-weight: var(--font-medium); color: ${isDone ? 'var(--color-text-tertiary)' : 'var(--color-text-primary)'}; text-decoration: ${isDone ? 'line-through' : 'none'};">
                  ${escapeHtml(t.title)}
                </div>
                ${t.description ? `<div style="font-size: var(--text-xs); color: var(--color-text-tertiary); margin-top: 2px;">${escapeHtml(t.description)}</div>` : ''}
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: var(--space-3);">
              ${t.due_date ? `<span style="font-size: var(--text-xs); color: var(--color-text-secondary); white-space: nowrap;">📅 ${formatDate(t.due_date)}</span>` : ''}
              <span class="badge ${priorityColors[t.priority] || 'badge-neutral'}" style="text-transform: uppercase; font-size: 10px;">${t.priority}</span>
              <button class="btn btn-ghost btn-xs btn-edit-task" data-id="${t.id}" title="Edit">✏️</button>
              <button class="btn btn-ghost btn-xs btn-del-task" data-id="${t.id}" title="Delete" style="color: var(--color-status-danger);">🗑️</button>
            </div>
          </div>
        `;
      }).join('');

      // Wire checkboxes
      document.querySelectorAll('.task-checkbox').forEach(cb => {
        cb.addEventListener('change', async () => {
          const id = cb.getAttribute('data-id');
          const newStatus = cb.checked ? 'done' : 'todo';
          const res = await updateTask(id, { status: newStatus });
          if (res.ok) {
            const task = allTasks.find(t => t.id === id);
            if (task) task.status = newStatus;
            updateCounts();
            renderFilteredTasks();
            showToast(newStatus === 'done' ? 'Task marked complete' : 'Task reopened', 'success');
          }
        });
      });

      // Wire Edit buttons
      document.querySelectorAll('.btn-edit-task').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const t = allTasks.find(x => x.id === id);
          if (t) openModal(t);
        });
      });

      // Wire Delete buttons
      document.querySelectorAll('.btn-del-task').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const confirmed = await showConfirm({
            title: 'Delete Task',
            message: 'Are you sure you want to delete this task?',
            confirmText: 'Delete',
            danger: true,
          });
          if (!confirmed) return;
          const res = await deleteTask(id);
          if (res.ok) {
            allTasks = allTasks.filter(t => t.id !== id);
            updateCounts();
            renderFilteredTasks();
            showToast('Task deleted', 'success');
          }
        });
      });
    }

    // Filter pills
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('btn-primary', 'active');
          b.classList.add('btn-secondary');
        });
        btn.classList.add('btn-primary', 'active');
        btn.classList.remove('btn-secondary');
        currentFilter = btn.getAttribute('data-filter');
        renderFilteredTasks();
      });
    });

    document.getElementById('task-search').addEventListener('input', renderFilteredTasks);

    // Modal
    function openModal(t = null) {
      document.getElementById('task-form').reset();
      if (t) {
        document.getElementById('modal-title').textContent = 'Edit Task';
        document.getElementById('task-id').value = t.id;
        document.getElementById('task-title').value = t.title;
        document.getElementById('task-priority').value = t.priority;
        document.getElementById('task-status').value = t.status;
        document.getElementById('task-due-date').value = t.due_date ? t.due_date.split('T')[0] : '';
        document.getElementById('task-assigned').value = t.assigned_to || '';
        document.getElementById('task-desc').value = t.description || '';
      } else {
        document.getElementById('modal-title').textContent = 'Add New Task';
        document.getElementById('task-id').value = '';
      }
      document.getElementById('task-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.add('hidden');
    }

    document.getElementById('btn-open-add-task').addEventListener('click', () => openModal());
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

    document.getElementById('task-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const title = document.getElementById('task-title').value.trim();
      const priority = document.getElementById('task-priority').value;
      const status = document.getElementById('task-status').value;
      const due_date = document.getElementById('task-due-date').value || null;
      const assigned_to = document.getElementById('task-assigned').value.trim() || null;
      const description = document.getElementById('task-desc').value.trim() || null;

      if (!title) {
        showToast('Please enter a task title', 'error');
        return;
      }

      const payload = { title, priority, status, due_date, assigned_to, description };
      let res;
      if (id) {
        res = await updateTask(id, payload);
      } else {
        res = await createTask(selectedEventId, payload);
      }

      if (res.ok) {
        showToast(id ? 'Task updated' : 'Task created', 'success');
        closeModal();
        refreshTasks();
      } else {
        showToast(res.error || 'Failed to save task', 'error');
      }
    });

    document.getElementById('event-selector').addEventListener('change', (e) => {
      selectedEventId = e.target.value;
      localStorage.setItem('planora_active_event_id', selectedEventId);
      refreshTasks();
    });

    loadEvents();
  </script>
</body>
</html>
