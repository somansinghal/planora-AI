<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Management – Planora AI</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo/planora-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout" id="app-root"></div>
  <div id="toast-container" role="alert" aria-live="polite"></div>

  <!-- Add Guest Modal -->
  <div class="modal-backdrop hidden" id="guest-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" style="max-width: 520px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Add Guest</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close dialog">&times;</button>
      </div>
      <form id="guest-form">
        <input type="hidden" id="g-id" value="">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="g-name">Guest Full Name <span class="required">*</span></label>
            <input type="text" id="g-name" class="form-input" placeholder="e.g. Ananya & Rohan Sen" required maxlength="200">
          </div>

          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="g-email">Email Address</label>
              <input type="email" id="g-email" class="form-input" placeholder="ananya@example.com" maxlength="254">
            </div>
            <div class="form-group">
              <label class="form-label" for="g-phone">Phone Number</label>
              <input type="tel" id="g-phone" class="form-input" placeholder="+91 98765 00000" maxlength="20">
            </div>
          </div>

          <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label" for="g-rsvp">RSVP Status</label>
              <select id="g-rsvp" class="form-input form-select">
                <option value="pending" selected>Pending</option>
                <option value="confirmed">Confirmed (Attending)</option>
                <option value="declined">Declined</option>
                <option value="maybe">Maybe</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="g-table">Table / Seating Zone</label>
              <input type="text" id="g-table" class="form-input" placeholder="e.g. Table 4 / VIP Lounge" maxlength="100">
            </div>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-text-primary);">
              <input type="checkbox" id="g-plus-one"> Includes Plus-One (+1 Attendee)
            </label>
          </div>

          <div class="form-group">
            <label class="form-label" for="g-diet">Dietary Preferences</label>
            <input type="text" id="g-diet" class="form-input" placeholder="e.g. Vegetarian, Nut Allergy, Jain Food" maxlength="200">
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="g-notes">Notes / Special Requests</label>
            <input type="text" id="g-notes" class="form-input" placeholder="e.g. Needs wheelchair access at entrance" maxlength="500">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-guest">Save Guest</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, showAuthLoading, hideAuthLoading } from './js/auth-guard.js';
    import { getAppShellHTML, getTopbarHTML } from './js/app-shell.js';
    import { getEvents, getEvent, getGuests, createGuest, updateGuest, deleteGuest, getGuestSummary, getExportUrl } from './js/api.js';
    import { showToast, escapeHtml, showConfirm } from './js/utils.js';
    import { initSidebar } from './js/navigation.js';

    showAuthLoading();
    const user = await requireAuth();
    hideAuthLoading();

    const urlParams = new URLSearchParams(window.location.search);
    let selectedEventId = urlParams.get('event_id') || localStorage.getItem('planora_active_event_id');
    let currentEvent = null;
    let allGuests = [];

    const root = document.getElementById('app-root');
    root.innerHTML = `
      ${getAppShellHTML('guests')}
      <div class="app-main" id="app-main">
        ${getTopbarHTML('Guest Management')}
        <main class="app-content page-enter">
          <div class="workspace-header">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4);">
              <div>
                <div class="workspace-event-type">👥 Hospitality & Attendance</div>
                <h1 class="workspace-event-name" style="font-size: var(--text-2xl);" id="page-event-name">Event Guests</h1>
                <p style="color: var(--color-text-secondary); margin-top: var(--space-1); font-size: var(--text-sm);">
                  Track RSVPs, manage dietary requirements, seat arrangements, and real-time headcounts.
                </p>
              </div>
              <div style="display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;">
                <select id="event-selector" class="form-input form-select" style="padding: var(--space-2) var(--space-3); font-size: var(--text-sm); min-width: 220px;">
                  <option value="">Loading events...</option>
                </select>
                <button class="btn btn-primary btn-sm" id="btn-open-add-guest">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  <span>Add Guest</span>
                </button>
                <a id="btn-export-guests-csv" class="btn btn-secondary btn-sm" target="_blank" download>
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  <span>Export CSV</span>
                </a>
              </div>
            </div>

            <nav class="workspace-tabs" style="margin-top: var(--space-6); margin-bottom: 0;">
              <a href="planner.html" class="workspace-tab" id="tab-studio">✨ AI Studio</a>
              <a href="budget.html" class="workspace-tab" id="tab-budget">💰 Budget</a>
              <a href="timeline.html" class="workspace-tab" id="tab-timeline">📅 Timeline</a>
              <a href="tasks.html" class="workspace-tab" id="tab-tasks">✅ Tasks</a>
              <a href="vendors.html" class="workspace-tab" id="tab-vendors">🤝 Vendors</a>
              <a href="guests.html" class="workspace-tab active" id="tab-guests">👥 Guests</a>
              <a href="copilot.html" class="workspace-tab" id="tab-copilot">🤖 Copilot</a>
              <a href="reports.html" class="workspace-tab" id="tab-reports">📊 Reports</a>
            </nav>
          </div>

          <div id="no-event-view" class="card empty-state hidden" style="padding: var(--space-12); text-align: center;">
            <div class="empty-icon" style="font-size: 3rem; margin-bottom: var(--space-4);">👥</div>
            <h3 style="font-size: var(--text-xl); font-weight: var(--font-semibold); margin-bottom: var(--space-2);">No Event Selected</h3>
            <p style="color: var(--color-text-secondary); max-width: 440px; margin: 0 auto var(--space-6);">Create an event first to manage guest lists.</p>
            <a href="create-event.html" class="btn btn-primary">Create Event</a>
          </div>

          <div id="guests-view" class="hidden">
            <!-- Summary Stats -->
            <div class="dashboard-stats" style="margin-bottom: var(--space-6);">
              <div class="stat-card">
                <div class="stat-card-title">Total Invited</div>
                <div class="stat-card-value" id="stat-invited">0</div>
                <div class="stat-card-subtext">Invited entries</div>
              </div>
              <div class="stat-card">
                <div class="stat-card-title">Confirmed Headcount</div>
                <div class="stat-card-value" id="stat-attending" style="color: #34D399;">0</div>
                <div class="stat-card-subtext">Including +1 guests</div>
              </div>
              <div class="stat-card">
                <div class="stat-card-title">Pending RSVPs</div>
                <div class="stat-card-value" id="stat-pending" style="color: #FCD34D;">0</div>
                <div class="stat-card-subtext">Awaiting response</div>
              </div>
              <div class="stat-card">
                <div class="stat-card-title">Declined</div>
                <div class="stat-card-value" id="stat-declined" style="color: var(--color-text-tertiary);">0</div>
                <div class="stat-card-subtext">Cannot attend</div>
              </div>
            </div>

            <!-- Guests Table Card -->
            <div class="card" style="padding: var(--space-6);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-3);">
                <h3 style="font-size: var(--text-lg); font-weight: var(--font-semibold);">Guest List</h3>
                <input type="text" id="guest-search" class="form-input" placeholder="Search guests..." style="width: 220px; padding: var(--space-2) var(--space-3); font-size: var(--text-sm);">
              </div>

              <div style="overflow-x: auto;">
                <table class="table" style="width: 100%; border-collapse: collapse;">
                  <thead>
                    <tr style="border-bottom: 1px solid var(--color-border-subtle); text-align: left; font-size: var(--text-xs); color: var(--color-text-tertiary); text-transform: uppercase;">
                      <th style="padding: var(--space-3);">Guest Name</th>
                      <th style="padding: var(--space-3);">RSVP</th>
                      <th style="padding: var(--space-3);">+1</th>
                      <th style="padding: var(--space-3);">Contact</th>
                      <th style="padding: var(--space-3);">Diet / Notes</th>
                      <th style="padding: var(--space-3);">Table</th>
                      <th style="padding: var(--space-3); text-align: right;">Actions</th>
                    </tr>
                  </thead>
                  <tbody id="guests-tbody">
                    <!-- Dynamic rows -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    `;

    initSidebar();

    async function loadEvents() {
      const res = await getEvents();
      const selector = document.getElementById('event-selector');
      if (!res.ok || !res.data || !res.data.events || res.data.events.length === 0) {
        document.getElementById('no-event-view').classList.remove('hidden');
        document.getElementById('guests-view').classList.add('hidden');
        selector.innerHTML = '<option value="">No events found</option>';
        return;
      }

      const events = res.data.events;
      selector.innerHTML = events.map(ev => `
        <option value="${ev.id}" ${ev.id === selectedEventId ? 'selected' : ''}>
          ${escapeHtml(ev.name)}
        </option>
      `).join('');

      if (!selectedEventId || !events.some(e => e.id === selectedEventId)) {
        selectedEventId = events[0].id;
      }
      localStorage.setItem('planora_active_event_id', selectedEventId);

      document.getElementById('tab-studio').href = `planner.html?event_id=${selectedEventId}`;
      document.getElementById('tab-budget').href = `budget.html?event_id=${selectedEventId}`;
      document.getElementById('tab-timeline').href = `timeline.html?event_id=${selectedEventId}`;
      document.getElementById('tab-tasks').href = `tasks.html?event_id=${selectedEventId}`;
      document.getElementById('tab-vendors').href = `vendors.html?event_id=${selectedEventId}`;
      document.getElementById('tab-guests').href = `guests.html?event_id=${selectedEventId}`;
      document.getElementById('tab-copilot').href = `copilot.html?event_id=${selectedEventId}`;
      document.getElementById('tab-reports').href = `reports.html?event_id=${selectedEventId}`;

      await refreshGuests();
    }

    async function refreshGuests() {
      const evRes = await getEvent(selectedEventId);
      if (!evRes.ok) return;
      currentEvent = evRes.data;

      document.getElementById('no-event-view').classList.add('hidden');
      document.getElementById('guests-view').classList.remove('hidden');
      document.getElementById('page-event-name').textContent = `${currentEvent.name} – Guests`;
      document.getElementById('btn-export-guests-csv').href = getExportUrl(selectedEventId, 'guests');

      const [gRes, sumRes] = await Promise.all([
        getGuests(selectedEventId),
        getGuestSummary(selectedEventId),
      ]);

      allGuests = gRes.ok ? (gRes.data || []) : [];

      if (sumRes.ok && sumRes.data) {
        const s = sumRes.data;
        document.getElementById('stat-invited').textContent = s.total_invitations;
        document.getElementById('stat-attending').textContent = s.total_attending_headcount;
        document.getElementById('stat-pending').textContent = s.pending_count;
        document.getElementById('stat-declined').textContent = s.declined_count;
      }

      renderGuestsTable(allGuests);
    }

    function renderGuestsTable(guests) {
      const tbody = document.getElementById('guests-tbody');
      if (guests.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align: center; padding: var(--space-8); color: var(--color-text-tertiary); font-size: var(--text-sm);">
              No guests on the invite list yet. Click "Add Guest" to begin building your guest list.
            </td>
          </tr>
        `;
        return;
      }

      const rsvpBadges = {
        confirmed: { label: 'Confirmed', class: 'badge-success' },
        pending: { label: 'Pending', class: 'badge-warning' },
        declined: { label: 'Declined', class: 'badge-neutral' },
        maybe: { label: 'Maybe', class: 'badge-info' },
      };

      tbody.innerHTML = guests.map(g => {
        const badge = rsvpBadges[g.rsvp_status] || rsvpBadges.pending;
        return `
          <tr style="border-bottom: 1px solid var(--color-border-subtle); font-size: var(--text-sm);">
            <td style="padding: var(--space-3);">
              <strong>${escapeHtml(g.name)}</strong>
            </td>
            <td style="padding: var(--space-3);">
              <span class="badge ${badge.class}" style="font-size: 11px;">${badge.label}</span>
            </td>
            <td style="padding: var(--space-3); color: var(--color-text-secondary);">
              ${g.plus_one ? 'Yes (+1)' : 'No'}
            </td>
            <td style="padding: var(--space-3); font-size: var(--text-xs); color: var(--color-text-secondary);">
              ${g.email ? `<div>${escapeHtml(g.email)}</div>` : ''}
              ${g.phone ? `<div>${escapeHtml(g.phone)}</div>` : ''}
              ${!g.email && !g.phone ? '—' : ''}
            </td>
            <td style="padding: var(--space-3); font-size: var(--text-xs); color: var(--color-text-tertiary);">
              ${g.dietary_preference ? `<div>🥗 ${escapeHtml(g.dietary_preference)}</div>` : ''}
              ${g.notes ? `<div>📝 ${escapeHtml(g.notes)}</div>` : ''}
              ${!g.dietary_preference && !g.notes ? '—' : ''}
            </td>
            <td style="padding: var(--space-3); font-size: var(--text-xs);">
              ${g.table_assignment ? `<span class="badge badge-neutral">${escapeHtml(g.table_assignment)}</span>` : '—'}
            </td>
            <td style="padding: var(--space-3); text-align: right;">
              <button class="btn btn-ghost btn-xs btn-edit-g" data-id="${g.id}" title="Edit guest">✏️</button>
              <button class="btn btn-ghost btn-xs btn-del-g" data-id="${g.id}" title="Delete guest" style="color: var(--color-status-danger);">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.btn-edit-g').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const g = allGuests.find(x => x.id === id);
          if (g) openModal(g);
        });
      });

      document.querySelectorAll('.btn-del-g').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const confirmed = await showConfirm({
            title: 'Remove Guest',
            message: 'Are you sure you want to remove this guest?',
            confirmText: 'Remove',
            danger: true,
          });
          if (!confirmed) return;
          const res = await deleteGuest(id);
          if (res.ok) {
            allGuests = allGuests.filter(x => x.id !== id);
            refreshGuests();
            showToast('Guest removed', 'success');
          }
        });
      });
    }

    document.getElementById('guest-search').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = allGuests.filter(g =>
        g.name.toLowerCase().includes(term) ||
        (g.email && g.email.toLowerCase().includes(term)) ||
        (g.table_assignment && g.table_assignment.toLowerCase().includes(term))
      );
      renderGuestsTable(filtered);
    });

    // Modal
    function openModal(g = null) {
      document.getElementById('guest-form').reset();
      if (g) {
        document.getElementById('modal-title').textContent = 'Edit Guest';
        document.getElementById('g-id').value = g.id;
        document.getElementById('g-name').value = g.name;
        document.getElementById('g-email').value = g.email || '';
        document.getElementById('g-phone').value = g.phone || '';
        document.getElementById('g-rsvp').value = g.rsvp_status || 'pending';
        document.getElementById('g-table').value = g.table_assignment || '';
        document.getElementById('g-plus-one').checked = !!g.plus_one;
        document.getElementById('g-diet').value = g.dietary_preference || '';
        document.getElementById('g-notes').value = g.notes || '';
      } else {
        document.getElementById('modal-title').textContent = 'Add Guest';
        document.getElementById('g-id').value = '';
      }
      document.getElementById('guest-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('guest-modal').classList.add('hidden');
    }

    document.getElementById('btn-open-add-guest').addEventListener('click', () => openModal());
    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

    document.getElementById('guest-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('g-id').value;
      const name = document.getElementById('g-name').value.trim();
      const email = document.getElementById('g-email').value.trim() || null;
      const phone = document.getElementById('g-phone').value.trim() || null;
      const rsvp_status = document.getElementById('g-rsvp').value;
      const table_assignment = document.getElementById('g-table').value.trim() || null;
      const plus_one = document.getElementById('g-plus-one').checked;
      const dietary_preference = document.getElementById('g-diet').value.trim() || null;
      const notes = document.getElementById('g-notes').value.trim() || null;

      if (!name) {
        showToast('Please enter guest name', 'error');
        return;
      }

      const payload = {
        name,
        email,
        phone,
        rsvp_status,
        table_assignment,
        plus_one,
        dietary_preference,
        notes,
      };

      let res;
      if (id) {
        res = await updateGuest(id, payload);
      } else {
        res = await createGuest(selectedEventId, payload);
      }

      if (res.ok) {
        showToast(id ? 'Guest updated' : 'Guest added', 'success');
        closeModal();
        refreshGuests();
      } else {
        showToast(res.error || 'Failed to save guest', 'error');
      }
    });

    document.getElementById('event-selector').addEventListener('change', (e) => {
      selectedEventId = e.target.value;
      localStorage.setItem('planora_active_event_id', selectedEventId);
      refreshGuests();
    });

    loadEvents();
  </script>
</body>
</html>
